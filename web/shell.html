<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0b">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    @font-face { font-family: Plex; src: url('loader-font.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0a0a0b; color: #e6e2d6; }
    body { overflow: hidden; font: 14px/1.7 Plex, 'Courier New', monospace; }
    #canvas { display: block; border: 0; outline: none; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; padding: 28px; background: #0a0a0b; }
    .terminal { width: min(580px, 100%); }
    .machine { margin: 0 0 18px; color: #6fdc8c; font-size: 15px; }
    .machine::before { content: '> '; }
    h1 { margin: 0; font-size: clamp(34px, 8vw, 56px); font-weight: 400; line-height: 1.3; margin-bottom: 22px; letter-spacing: .04em; text-shadow: 3px 0 rgba(229, 56, 74, .85); }
    .divider { border: 0; border-top: 3px solid #e5384a; width: 64px; margin: 0 0 28px; }
    #status { margin: 0 0 16px; min-height: 24px; }
    #status::before { content: '> '; color: #6fdc8c; }
    progress { display: block; width: 100%; height: 10px; border: 1px solid #2c2c31; border-radius: 0; background: #141416; appearance: none; accent-color: #6fdc8c; }
    progress::-webkit-progress-bar { background: #141416; }
    progress::-webkit-progress-value { background: #6fdc8c; }
    progress::-moz-progress-bar { background: #6fdc8c; }
    progress:not([value]) { animation: standby 1.5s steps(2, end) infinite; }
    .cursor { color: #6fdc8c; animation: standby 1.2s steps(2, end) infinite; }
    #failure { white-space: pre-wrap; overflow-wrap: anywhere; color: #e5384a; max-height: 30vh; overflow-y: auto; }
    #retry { margin: 20px 0 0; padding: 10px 24px; color: #e6e2d6; background: #141416; border: 1px solid #2c2c31; font: inherit; cursor: pointer; }
    #retry:hover, #retry:focus-visible { border-color: #6fdc8c; outline: 1px solid #6fdc8c; outline-offset: 3px; }
    [hidden] { display: none !important; }
    noscript { position: fixed; inset: auto 28px 24px; z-index: 2; color: #e5384a; text-align: center; }
    @keyframes standby { 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
    @media (max-height: 500px) { #loader { overflow-y: auto; place-items: start center; } .machine { margin-bottom: 18px; } }
  </style>
  $GODOT_HEAD_INCLUDE
  <script>
  // Audio diagnostics: run prsAudioReport() in the console to see what the
  // game's Web Audio graph is doing (context state, sample rate, output level).
  (function () {
    const Native = window.AudioContext || window.webkitAudioContext;
    if (!Native) return;
    const contexts = [];
    const outputs = new Set();
    const connect = AudioNode.prototype.connect;
    AudioNode.prototype.connect = function (target, ...rest) {
      if (target instanceof AudioDestinationNode) outputs.add(this);
      return connect.call(this, target, ...rest);
    };
    function Wrapped(...args) { const ctx = new Native(...args); contexts.push(ctx); return ctx; }
    Wrapped.prototype = Native.prototype;
    window.AudioContext = Wrapped;
    window.prsAudioReport = async function () {
      const report = [];
      for (const ctx of contexts) {
        const levels = [];
        for (const node of outputs) {
          if (node.context !== ctx) continue;
          const meter = ctx.createAnalyser();
          meter.fftSize = 2048;
          connect.call(node, meter);
          await new Promise((r) => setTimeout(r, 400));
          const data = new Float32Array(meter.fftSize);
          meter.getFloatTimeDomainData(data);
          let sum = 0;
          for (const v of data) sum += v * v;
          node.disconnect(meter);
          levels.push(node.constructor.name + " " + Math.sqrt(sum / data.length).toFixed(4));
        }
        report.push({ state: ctx.state, sampleRate: ctx.sampleRate, time: ctx.currentTime.toFixed(1), sinkId: ctx.sinkId, levels });
      }
      return JSON.stringify({ contexts: report, search: location.search });
    };
  })();
  </script>
  <script src="$GODOT_URL" defer></script>
</head>
<body>
  <canvas id="canvas" aria-label="PRs please game">This game requires a browser with canvas support.</canvas>
  <main id="loader" aria-busy="true">
    <section class="terminal" aria-labelledby="title">
      <p class="machine">hello, friend.<span class="cursor" aria-hidden="true">_</span></p>
      <h1 id="title">PRs please</h1>
      <hr class="divider">
      <p id="status" role="status" aria-live="polite">Loading workstation files…</p>
      <progress id="progress" aria-label="Game download"></progress>
      <p id="failure" role="alert" hidden></p>
      <button id="retry" type="button" hidden>RETRY STARTUP</button>
    </section>
  </main>
  <noscript>Enable JavaScript to start PRs please.</noscript>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loader = document.getElementById('loader');
      const status = document.getElementById('status');
      const progress = document.getElementById('progress');
      const failure = document.getElementById('failure');
      const retry = document.getElementById('retry');
      retry.addEventListener('click', () => window.location.reload());
      try {
        if (typeof Engine === 'undefined') throw new Error('The game could not be downloaded. Check your connection and retry.');
        const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
        if (missing.length) throw new Error('This browser cannot start the game. Try an up-to-date desktop browser with WebGL 2 enabled.\n\nMissing support: ' + missing.join(', '));
        const engine = new Engine($GODOT_CONFIG);
        await engine.startGame({ onProgress(current, total) {
          if (total > 0) {
            progress.max = total;
            progress.value = Math.min(current, total);
            if (current >= total) status.textContent = 'Starting workstation…';
          } else {
            progress.removeAttribute('value');
          }
        } });
        loader.remove();
      } catch (error) {
        console.error(error);
        loader.setAttribute('aria-busy', 'false');
        status.textContent = 'Startup interrupted.';
        progress.hidden = true;
        failure.textContent = error instanceof Error ? error.message : String(error);
        failure.hidden = false;
        retry.hidden = false;
      }
    });
  </script>
</body>
</html>
